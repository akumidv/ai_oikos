name: akmon

on: [push, pull_request]

jobs:
  akmon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node _aitna/akmon/js/akmon/cli.mjs sync --check
      - run: node _aitna/akmon/js/akmon/cli.mjs verify --strict

  oikos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
