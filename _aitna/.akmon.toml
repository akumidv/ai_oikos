# akmon integration record — written by `akmon init`, refreshed on realign.
# The version this project sits on; a later bump diffs the CHANGELOG window against it.
mount = "submodule"
akmon_version = "v0.4.0"
attached_archetype = "package/javascript"

last_realign = "v0.4.0"
ecosystem = "node"
[test]
# The project's own pytest invocation, used verbatim by the release check
# (BOOTSTRAP §A5). Uncomment and set it to whatever this project already uses:
# runner = "uv run pytest"
runner = "npm test"

[check]
# What `akmon check` runs: the project's own commands, `{files}` becoming the files a run covers.
oxlint = "npx --no-install oxlint {files}"
